<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Runner | さんそんの活動記録</title>
  <meta name="description" content="ジャンプで障害物を避けるランゲームです。" />
  <link rel="icon" href="../../favicon.ico?v=1" type="image/x-icon" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
  <header>
    <nav></nav>
  </header>
  <main>
    <section class="page-section game-shell">
      <div class="hud">
        <p id="runner-score">Score: 0</p>
        <div class="button-row">
          <button id="runner-start" type="button">スタート</button>
          <a class="button-link secondary" href="../">ゲーム一覧へ戻る</a>
        </div>
      </div>
      <div class="game-instructions">
        <article>
          <span>PC</span>
          <p>スペースキー / 上矢印でジャンプ</p>
        </article>
        <article>
          <span>スマホ</span>
          <p>ジャンプボタン、またはゲーム画面をタップ</p>
        </article>
        <article>
          <span>リトライ</span>
          <p>スタートボタンからすぐに再挑戦</p>
        </article>
      </div>
      <canvas id="runner-canvas" class="game-canvas" width="900" height="420"></canvas>
      <div class="touch-controls two">
        <button id="runner-jump" type="button">ジャンプ</button>
        <button id="runner-restart-mobile" type="button">リスタート</button>
      </div>
      <p class="game-note" id="runner-status">スタートを押すとゲームが始まります。</p>
    </section>
  </main>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/runner-game.js"></script>
</body>
</html>
