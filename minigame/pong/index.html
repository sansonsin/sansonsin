<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Pong | さんそんの活動記録</title>
  <meta name="description" content="シンプルに遊べるピンポンゲームです。" />
  <link rel="icon" href="../../favicon.ico?v=1" type="image/x-icon" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
  <header>
    <nav></nav>
  </header>
  <main>
    <section class="page-section game-shell">
      <div class="hud">
        <p id="pong-score">Player 0 - 0 CPU</p>
        <div class="button-row">
          <button id="pong-start" type="button">スタート</button>
          <a class="button-link secondary" href="../">ゲーム一覧へ戻る</a>
        </div>
      </div>
      <div class="game-instructions">
        <article>
          <span>PC</span>
          <p>上矢印 / 下矢印でラケット移動</p>
        </article>
        <article>
          <span>スマホ</span>
          <p>上へ / 下へボタンを押し続ける</p>
        </article>
        <article>
          <span>勝利条件</span>
          <p>CPUより先に5点を取る</p>
        </article>
      </div>
      <canvas id="pong-canvas" class="game-canvas" width="900" height="500"></canvas>
      <div class="touch-controls two">
        <button data-pong="up" type="button">上へ</button>
        <button data-pong="down" type="button">下へ</button>
      </div>
      <p class="game-note" id="pong-status">スタートを押すとラリーが始まります。</p>
    </section>
  </main>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/pong-game.js"></script>
</body>
</html>
