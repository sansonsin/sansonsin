<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">さんそんの活動記録 メインビジュアル仮画像</title>
  <desc id="desc">後で差し替えるためのメインビジュアル仮画像です。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a4d"/>
      <stop offset=".48" stop-color="#6a33b1"/>
      <stop offset="1" stop-color="#e20451"/>
    </linearGradient>
    <pattern id="stripe" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <rect width="3" height="34" fill="rgba(255,255,255,.18)"/>
    </pattern>
    <radialGradient id="glow" cx=".75" cy=".42" r=".45">
      <stop offset="0" stop-color="#19c8f4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#19c8f4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#stripe)" opacity=".5"/>
  <rect width="1600" height="720" fill="url(#glow)"/>
  <circle cx="1220" cy="340" r="190" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
  <text x="120" y="336" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="92" font-weight="800">さんそんの活動記録</text>
  <text x="126" y="410" fill="#bff2ff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" letter-spacing="4">SANSON ACTIVITY SITE</text>
</svg>
